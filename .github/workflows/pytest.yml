name: Pytest UI + API Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run API tests
        run: pytest -v tests/api --junitxml=api-results.xml
      - name: Prepare report folder
        run: mkdir -p reports
      - name: Run UI tests and create Allure results
        run: pytest -v tests/ui --alluredir=allure-results --html=reports/pytest-report.html --self-contained-html
        env:
          HEADLESS: "true"
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-ui-api-reports
          path: |
            api-results.xml
            reports/
            allure-results/
